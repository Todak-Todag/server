spring:
  cloud:
    config:
      enabled: false

  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000
          multiplier: 2

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: care_plan_schema
        hbm2ddl:
          create_namespaces: true
    show-sql: true

eureka:
  client:
    enabled: false

internal:
  key: test-internal-key

internal-jwt:
  jwk-set-uri: http://localhost:8080/.well-known/jwks.json
  issuer: todak-api-gateway
  audience: care-plan-service
  clock-skew: 30s
