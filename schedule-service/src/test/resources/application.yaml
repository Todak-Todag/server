spring:
  application:
    name: schedule-service

  datasource:
    url: jdbc:postgresql://localhost:5432/todaktodag_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: none

    open-in-view: false

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        default_schema: public
        default_batch_fetch_size: 100

internal:
  key: 01234567890123456789012345678901

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

  health:
    db:
      enabled: false
    redis:
      enabled: false
    discovery:
      enabled: false

  tracing:
    enabled: false


logging:
  level:
    com.todak_todag.schedule_service: debug

---
# DB에 실제로 접근하는 테스트(@DataJpaTest 등)에서 @ActiveProfiles("test")로 사용한다.
# 기본 프로필은 운영과 동일하게 ddl-auto: none을 유지하고, 이 프로필에서만 스키마를 자동 생성한다.
spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true