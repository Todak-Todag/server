spring:
  config:
    activate:
      on-profile: test

    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  cloud:
    config:
      import-check:
        enabled: false

  application:
    name: schedule-service

  datasource:
    url: jdbc:postgresql://localhost:5432/todaktodag_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1

  # 운영(config-repo)과 동일한 수신 재시도 설정 — 3회, DLQ 미운용
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

internal:
  key: 01234567890123456789012345678901

schedule:
  outbox:
    relay:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

  health:
    db:
      enabled: false
    redis:
      enabled: false
    discovery:
      enabled: false

  tracing:
    enabled: false


logging:
  level:
    com.todak_todag.schedule_service: debug
