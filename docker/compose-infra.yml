services:

  # 관계형 데이터베이스.
  postgres:
    image: postgres:17
    container_name: todak-postgres
    restart: unless-stopped

    # PostgreSQL 초기 설정.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # PostgreSQL 포트 연결.
    ports:
      - "${POSTGRES_PORT}:5432"

    # PostgreSQL 데이터 영속화.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro

    # PostgreSQL 상태 확인.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    # 공통 Docker 네트워크 연결.
    networks:
      - todak-network


  # 캐시 및 임시 데이터 저장소.
  redis:
    image: redis:7.4
    container_name: todak-redis
    restart: unless-stopped

    # Redis 포트 연결.
    ports:
      - "6379:6379"

    # Redis 데이터 영속화 설정.
    command: redis-server --appendonly yes

    # Redis 데이터 영속화.
    volumes:
      - redis-data:/data

    # Redis 상태 확인.
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - todak-network


  # 비동기 메시지 브로커.
  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: todak-rabbitmq
    restart: unless-stopped

    # RabbitMQ 초기 계정 설정.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      # AMQP 통신 포트.
      - "${RABBITMQ_PORT}:5672"

      # Management UI 포트.
      - "15672:15672"

    # RabbitMQ 데이터 영속화.
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    # RabbitMQ 상태 확인.
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - todak-network


  # 분산 추적 서버.
  zipkin:
    image: openzipkin/zipkin:3
    container_name: todak-zipkin
    restart: unless-stopped

    # Zipkin 포트 연결.
    ports:
      - "9411:9411"

    # Zipkin 상태 확인.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9411/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - todak-network


  # 중앙 설정 서버.
  config-server:
    build:
      # 프로젝트 루트를 빌드 기준 경로로 지정.
      context: ..

      # Config Server Dockerfile 사용.
      dockerfile: config-server/Dockerfile

      # 빌드된 JAR 파일 전달.
      args:
        JAR_FILE: config-server/build/libs/*.jar

    container_name: todak-config-server
    restart: unless-stopped

    environment:
      # 로컬 프로파일 사용.
      SPRING_PROFILES_ACTIVE: local,native

      # 컨테이너 내부 Config Repository 경로 지정.
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

    # Config Server 포트 연결.
    ports:
      - "8888:8888"

    # Config Repository 연결.
    volumes:
      - ../config-repo:/config-repo

    # Config Server 상태 확인.
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8888/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - todak-network


  # 서비스 디스커버리 서버.
  eureka-server:
    build:
      # 프로젝트 루트를 빌드 기준 경로로 지정.
      context: ..

      # Eureka Server Dockerfile 사용.
      dockerfile: eureka-server/Dockerfile

      # 빌드된 JAR 파일 전달.
      args:
        JAR_FILE: eureka-server/build/libs/*.jar

    container_name: todak-eureka-server
    restart: unless-stopped

    environment:
      # 로컬 프로파일 사용.
      SPRING_PROFILES_ACTIVE: local

      # Docker 내부 Config Server 주소 지정.
      CONFIG_SERVER_URL: http://config-server:8888

    # Eureka Server 포트 연결.
    ports:
      - "8761:8761"

    # Config Server 준비 후 실행.
    depends_on:
      config-server:
        condition: service_healthy

    # Eureka Server 상태 확인.
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8761/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - todak-network


  # API 요청 공통 진입점.
  api-gateway:
    build:
      # 프로젝트 루트를 빌드 기준 경로로 지정.
      context: ..

      # API Gateway Dockerfile 사용.
      dockerfile: api-gateway/Dockerfile

      # 빌드된 JAR 파일 전달.
      args:
        JAR_FILE: api-gateway/build/libs/*.jar

    container_name: todak-api-gateway
    restart: unless-stopped

    environment:
      # 로컬 프로파일 사용.
      SPRING_PROFILES_ACTIVE: local
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_HOST: eureka-server

      REDIS_HOST: redis
      REDIS_PORT: 6379
      ZIPKIN_HOST: zipkin

      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_KEY_PREFIX: ${ACCESS_KEY_PREFIX}
      
      ACCESS_COOKIE_NAME: ${ACCESS_COOKIE_NAME}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME}

      # Docker 내부 Config Server 주소 지정.
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888

      # Docker 내부 Eureka Server 주소 지정.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    # Gateway 포트 연결.
    ports:
      - "8080:8080"

    # Config/Eureka/redis 준비 후 실행.
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Gateway 상태 확인.
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    # 공통 Docker 네트워크 연결.
    networks:
      - todak-network

  # 메트릭 수집 및 저장.
  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: todak-prometheus
    restart: unless-stopped

    # Prometheus 설정 및 데이터 영속화.
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    # Prometheus UI 포트.
    ports:
      - "9090:9090"

    networks:
      - todak-network


  # 로그 저장소.
  loki:
    image: grafana/loki:3.7
    container_name: todak-loki
    restart: unless-stopped

    # Loki 설정 파일 사용.
    command: -config.file=/etc/loki/loki-config.yml

    # Loki 설정 및 데이터 영속화.
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

    # Loki API 포트.
    ports:
      - "3100:3100"

    networks:
      - todak-network


  # Docker 컨테이너 로그 수집.
  alloy:
    image: grafana/alloy:v1.19.0
    container_name: todak-alloy
    restart: unless-stopped

    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:10000
      - --storage.path=/var/lib/alloy/data

    volumes:
      # Alloy 설정.
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro

      # Docker 컨테이너 검색 및 로그 수집.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # 로그 읽기 위치 등 Alloy 상태 영속화.
      - alloy-data:/var/lib/alloy/data

    # Alloy UI.
    ports:
      - "10000:10000"

    depends_on:
      - loki

    networks:
      - todak-network


  # Metrics / Logs 시각화.
  grafana:
    image: grafana/grafana:13.2
    container_name: todak-grafana
    restart: unless-stopped

    # Grafana UI.
    ports:
      - "3000:3000"

    # Grafana 설정 및 대시보드 영속화.
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/todak-observability.json:/var/lib/grafana/dashboards/todak-observability.json:ro

    depends_on:
      - prometheus
      - loki

    networks:
      - todak-network

# 컨테이너 데이터 영속화.
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:

# 컨테이너 간 통신용 네트워크.
networks:
  todak-network:
    name: todak-network
    driver: bridge
