global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: prod

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:10001

scrape_configs:
  # Prometheus 자체 상태 (수집 지연, TSDB 크기)
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']