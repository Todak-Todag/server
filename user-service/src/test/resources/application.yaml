# eclipse 쓰면 build path 자동으로 연결을 안해준다...

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/todaktodag_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        default_schema: user_schema
        default_batch_fetch_size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

  health:
    db:
      enabled: false
    redis:
      enabled: false
    discovery:
      enabled: false

  tracing:
    export:
      enabled: false

logging:
  level:
    com.todak_todag.provider_service: debug