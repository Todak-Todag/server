server:
  port: 19090

spring:
  application:
    name: user-service
  profiles:
    active: local

  config:
    import:
      - optional:file:.env[.properties]
      
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:todaktodag_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 3s

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: user_schema
        default_batch_fetch_size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
        
  endpoint:
    health:
      show-details: never
      
  tracing:
    sampling:
      probability: 1.0
      
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
        
logging:
  level:
    com.todak_todag.user_service: info

internal:
  key: ${INTERNAL_API_KEY}
  
jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${ACCESS_EXPIRATION:30m}
    max-age: ${REFRESH_EXPIRATION:7d} # 지금 토큰 인증 구조에선 RefreshToken 과 똑같이
  refresh:
    expiration: ${REFRESH_EXPIRATION:7d}
    max-age: ${REFRESH_EXPIRATION:7d}
  secure: true

authentication:
  access-token:
    redis-key-prefix: ${ACCESS_KEY_PREFIX}

master:
  username: ${MASTER_USERNAME}
  password: ${MASTER_PASSWORD}
  name: ${MASTER_NAME}
---
spring:
  config:
    activate:
      on-profile: local
      
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true

  data:
    redis:
      host: localhost
      port: 6379
          
jwt:
  http-only: false
  secure: false
          
logging:
  level:
    com.todak_todag.user_service: debug
---
spring:
  config:
    activate:
      on-profile: prod
      
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  http-only: true
  secure: true
      
logging:
  level:
    com.todak_todag.user_service: info