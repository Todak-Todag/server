server:
  port: 19004

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:todaktodag_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    # 수신 재시도 — 3회, DLQ 미운용
    # DLQ가 없으므로 3회 후 메시지는 폐기
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 3

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: schedule_schema
        default_batch_fetch_size: 100

        # TODO: Flyway/Liquibase 도입 후 제거
        hbm2ddl:
          create_namespaces: true

internal:
  key: ${INTERNAL_API_KEY}

schedule:
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

logging:
  level:
    com.todak_todag.schedule_service: info
