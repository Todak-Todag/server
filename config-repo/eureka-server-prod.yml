---
# Eureka Server의 운영 실행 포트를 8761로 지정.
server:
  port: 8761

eureka:
  client:
    # Eureka Server 자기 자신을 서비스로 등록하지 않도록 지정.
    register-with-eureka: false

    # 다른 Eureka Server의 레지스트리를 조회하지 않도록 지정.
    fetch-registry: false

# Actuator 설정.
management:
  endpoints:
    web:
      exposure:
        # Eureka Server 상태 확인을 위한 Actuator 엔드포인트 노출.
        include: health,info

  endpoint:
    health:
      # 운영 환경에서는 상세 상태 정보를 외부에 노출하지 않음.
      # 응답 예시. {"status" : "UP"}
      show-details: never