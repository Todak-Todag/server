spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

internal:
  key: ${INTERNAL_API_KEY}

jwt:
  secret: ${JWT_SECRET}

authentication:
  access-token:
    redis-key-prefix: ${ACCESS_KEY_PREFIX}
    cookie-name: ${ACCESS_COOKIE_NAME}
    user-id-claim: sub
    role-claim: role
  refresh-token:
    cookie-name: ${REFRESH_COOKIE_NAME}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.todak_todag.api_gateway: debug
