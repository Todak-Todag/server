server:
  port: 19003

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:todaktodag_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: provider_schema
        default_batch_fetch_size: 100
        format_sql: true
        hbm2ddl:
          create_namespaces: true

  flyway:
    schemas: provider_schema
    default-schema: provider_schema

    show-sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

internal:
  key: ${INTERNAL_API_KEY}

internal-jwt:
  jwk-set-uri: ${GATEWAY_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  issuer: todak-api-gateway
  audience: ${spring.application.name}
  clock-skew: 30s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
