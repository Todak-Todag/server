server:
  port: 19003

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/todaktodag_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: provider_schema
        default_batch_fetch_size: 100
        format_sql: false
        hbm2ddl:
          create_namespaces: true

    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOST}:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST}:9411/api/v2/spans

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
