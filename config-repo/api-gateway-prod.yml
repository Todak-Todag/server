spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 3s

internal:
  key: ${INTERNAL_API_KEY}

jwt:
  secret: ${JWT_SECRET}

authentication:
  access-token:
    redis-key-prefix: ${ACCESS_KEY_PREFIX}
    cookie-name: ${ACCESS_COOKIE_NAME}
    user-id-claim: sub
    role-claim: role
  refresh-token:
    cookie-name: ${REFRESH_COOKIE_NAME}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.todak_todag.api_gateway: info       # local: debug

  endpoint:
    health:
      show-details: never          # local: always
      probes:
        enabled: true              # /actuator/health/readiness 노출
