jwt:
  secret: dG9kYWstdG9kYWctYXBpLWdhdGV3YXktdGVzdC1qd3Qtc2VjcmV0LWtleS1oczI1Ni0wMTIzNDU2Nzg5YWJjZA==

internal:
  key: test-internal-key
  
internal-jwt:
  private-key: 
  issuer: todak-api-gateway
  ttl: 60s

rate-limit:
  max-idle: 1h
  buckets:
    user-service-login:
      capacity: 20
      refill-tokens: 10
      refill-period: 1m

authentication:
  access-token:
    cookie-name: ${ACCESS_COOKIE_NAME:AccessToken}
    redis-key-prefix: "test:access-token:"
    user-id-claim: sub
    role-claim: role
  refresh-token:
    cookie-name: ${REFRESH_COOKIE_NAME:RefreshToken}

spring:
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    config:
      enabled: false

    gateway:
      server:
        webflux:
          redis:
            enabled: false   # 내장 RedisRateLimiter 를 끈다. Bucket4jRateLimiter 를 직접 구성해서 쓴다.

          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/admin/users/**,/api/v1/auth/**,/api/v1/regions/**,/api/v1/admin/regions/**,/api/v1/consent-documents/**,/api/v1/admin/consent-documents/**,/api/v1/consents/**

            - id: discharge-service
              uri: lb://discharge-service
              predicates:
                - Path=/api/v1/discharges/**

            - id: social-worker-service
              uri: lb://social-worker-service
              predicates:
                - Path=/api/v1/social-worker-matchings/**

            - id: schedule-service
              uri: lb://schedule-service
              predicates:
                - Path=/api/v1/service-schedules/**,/api/v1/service-results/**

            - id: provider-service
              uri: lb://provider-service
              predicates:
                - Path=/api/v1/provide-services/**,/api/v1/service-offerings/**,/api/v1/provide-works/**,/api/v1/admin/service-offerings/**,/api/v1/admin/provide-services/**

            - id: care-plan-service
              uri: lb://care-plan-service
              predicates:
                - Path=/api/v1/care-plans/**,/api/v1/admin/care-plans/**,/api/v1/care-plan-services/**,/api/v1/service-preferences/**
