server:
  port: 19003

spring:
  application:
    name: provider-service

  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:todaktodag_db}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: provider_schema
        default_batch_fetch_size: 100

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    # 수신 재시도 3회, DLQ 미운용
    # 재시도를 소진하면 메시지를 폐기한다 (재큐잉하면 무한 반복)
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000
          multiplier: 2

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  tracing:
    sampling:
      probability: 1.0

    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

internal:
  key: ${INTERNAL_API_KEY}

logging:
  level:
    com.todak_todag.provider_service: info

eureka:
  instance:
    hostname: localhost

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true

logging:
  level:
    com.todak_todag.provider_service: debug

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

    # TODO: Flyway/Liquibase 도입 후 제거
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true

logging:
  level:
    com.todak_todag.provider_service: info
