server:
  port: ${SERVER_PORT:19003}

spring:
  application:
    name: provider-service

  # datasource / jpa / rabbitmq 접속 정보, ddl-auto, tracing 등 환경별로 달라지는 값은
  # config-repo가 내려주며 여기 있는 값보다 우선한다
  # 이 파일에는 config-repo에 없는 애플리케이션 고유 설정만 둔다
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  jpa:
    open-in-view: false

  rabbitmq:
    # 수신 재시도 3회, DLQ 미운용
    # 재시도를 소진하면 메시지를 폐기한다 (재큐잉하면 무한 반복)
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000
          multiplier: 2

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.todak_todag.provider_service: info

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.todak_todag.provider_service: debug

# 호스트명이나 WSL 어댑터 IP로 등록되면 게이트웨이가 접근하지 못한다
# 운영에서는 실제 호스트로 등록되어야 하므로 local에만 둔다
eureka:
  instance:
    hostname: localhost
