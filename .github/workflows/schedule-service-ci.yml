name: Schedule-Service CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'schedule-service/**'
      - '.github/workflows/schedule-service-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: build & test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-service

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v6

      - name: build & test
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: schedule-service-test-report
          path: schedule-service/build/reports/tests/