name: user-service CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'user-service/**'
      - 'config-repo/user-service-*.yml'
      - '.github/workflows/user-service-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: build & test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-service

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todaktodag_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d todaktodag_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v6

      - name: apply schema
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d todaktodag_db -f docker/postgres/user-service.sql

      - name: build & test
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: user-service-test-report
          path: user-service/build/reports/tests/