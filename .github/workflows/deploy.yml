name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  detect:
    name: 변경 서비스 감지
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
      has_change: ${{ steps.set.outputs.has_change }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}   # 비교 기준 명시
          filters: |
            config-server: ['config-server/**']
            eureka-server: ['eureka-server/**']
            api-gateway: ['api-gateway/**']
            user-service: ['user-service/**']
            discharge-service: ['discharge-service/**']
            social-worker-service: ['social-worker-service/**']
            provider-service: ['provider-service/**']
            schedule-service: ['schedule-service/**']
            care-plan-service: ['care-plan-service/**']

      - id: set
        run: |
          echo "services=${{ toJSON(steps.filter.outputs.changes) }}" >> $GITHUB_OUTPUT
          if [ "${{ toJSON(steps.filter.outputs.changes) }}" = "[]" ]; then
            echo "has_change=false" >> $GITHUB_OUTPUT
          else
            echo "has_change=true" >> $GITHUB_OUTPUT
          fi

      - name: 마이그레이션 변경 경고
        run: |
          CH=$(git diff --name-only HEAD^ HEAD)
          if echo "$CH" | grep -q 'db/migration/'; then
            echo "::warning::스키마 마이그레이션이 포함되었습니다. 배포 전 pg_dump 백업을 확인하십시오."
          fi
          if echo "$CH" | grep -qE '^docker/(compose-data-deploy|compose-monitoring-deploy|prometheus|loki|grafana|alertmanager)/'; then
            echo "::warning::DATA 계층 설정 변경이 포함되었습니다. DATA EC2 에 수동 적용이 필요합니다."
          fi
          if echo "$CH" | grep -q '^config-repo/'; then
            echo "::warning::config-repo 변경이 포함되었습니다. config-server 재시작이 필요할 수 있습니다."
          fi

  build:
    name: 빌드 & ECR push
    needs: detect
    if: needs.detect.outputs.has_change == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: bootJar
        run: |
          cd ${{ matrix.service }}
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: JAR 1개인지 확인
        run: |
          N=$(ls ${{ matrix.service }}/build/libs/*.jar | wc -l)
          [ "$N" -eq 1 ] || { echo "JAR 가 ${N}개입니다"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: build & push
        run: |
          docker build -f ${{ matrix.service }}/Dockerfile \
            --build-arg JAR_FILE=${{ matrix.service }}/build/libs/*.jar \
            -t $ECR_REGISTRY/todak/${{ matrix.service }}:${{ github.sha }} \
            -t $ECR_REGISTRY/todak/${{ matrix.service }}:latest .
          docker push $ECR_REGISTRY/todak/${{ matrix.service }}:${{ github.sha }}
          docker push $ECR_REGISTRY/todak/${{ matrix.service }}:latest

  deploy:
    name: APP EC2 배포
    needs: [detect, build]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSM 배포 실행
        run: |
          SVCS=$(echo '${{ needs.detect.outputs.services }}' | jq -r 'join(" ")')
          echo "배포 대상: $SVCS"

          CMD=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --timeout-seconds 900 \
            --parameters commands="sudo -u ec2-user /opt/todak/deploy.sh ${{ github.sha }} $SVCS" \
            --query Command.CommandId --output text)

          echo "CommandId: $CMD"

          for i in $(seq 1 90); do
            ST=$(aws ssm get-command-invocation --command-id $CMD \
                 --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query Status --output text)
            [ "$ST" = "InProgress" ] || [ "$ST" = "Pending" ] || break
            sleep 10
          done

          echo "── stdout ──"
          aws ssm get-command-invocation --command-id $CMD \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query StandardOutputContent --output text

          echo "── stderr ──"
          aws ssm get-command-invocation --command-id $CMD \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query StandardErrorContent --output text

          [ "$ST" = "Success" ] || { echo "배포 실패 (상태: $ST)"; exit 1; }

      - name: 외부 스모크
        run: |
          sleep 10
          CODE=$(curl -s -o /dev/null -w '%{http_code}' https://${{ secrets.DOMAIN }}/api/v1/regions)
          echo "GET /api/v1/regions -> $CODE"
          [ "$CODE" = "200" ] || exit 1
