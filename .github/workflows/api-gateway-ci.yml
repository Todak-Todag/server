name: api-gateway CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'api-gateway/**'
      - 'config-repo/api-gateway-*.yml'
      - '.github/workflows/api-gateway-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: build & test (Java 21)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v6

      - name: build & test
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: api-gateway-test-report
          path: api-gateway/build/reports/tests/