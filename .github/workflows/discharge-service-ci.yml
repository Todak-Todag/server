name: Discharge-Service CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'discharge-service/**'
      - '.github/workflows/discharge-service-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: build & test (Java 21)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: discharge-service

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v6

      - name: build & test
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: discharge-service-test-report
          path: discharge-service/build/reports/tests/